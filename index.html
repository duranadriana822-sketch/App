<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinerest — Galería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e0e0e;
    --card: #1c1c1c;
    --text: #f0eeec;
    --text-dim: #9b9997;
    --accent: #e60023;
    --accent-hover: #ad081b;
    --pill: #2b2b2b;
    --pill-hover: #3a3a3a;
    --line: rgba(255,255,255,0.08);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header{
    position: sticky;
    top: 0;
    z-index: 30;
    display:flex;
    align-items:center;
    gap: 4px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .logo{
    width: 44px; height: 44px;
    min-width: 44px;
    border-radius: 50%;
    background: var(--accent);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 20px;
    cursor:pointer;
    border:none;
    transition: background 0.2s ease;
  }
  .logo:hover{ background: var(--accent-hover); }

  nav.pills{
    display:flex;
    align-items:center;
    gap: 2px;
    margin-left: 4px;
  }
  nav.pills button{
    border:none;
    background: transparent;
    color: var(--text);
    font-family:'Inter',sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 16px;
    border-radius: 24px;
    cursor:pointer;
    transition: background 0.2s ease;
    white-space: nowrap;
  }
  nav.pills button:hover{ background: var(--pill); }
  nav.pills button.active{ background: var(--text); color: #111; }
  @media (max-width: 680px){ nav.pills button:not(.active){ display:none; } }

  .search{
    flex: 1;
    display:flex;
    align-items:center;
    gap: 8px;
    background: var(--pill);
    border-radius: 24px;
    padding: 12px 16px;
    margin: 0 10px;
    max-width: 720px;
    transition: background 0.2s ease, outline 0.2s ease;
  }
  .search:focus-within{ background: var(--pill-hover); outline: 2px solid var(--text); }
  .search svg{ flex:none; opacity:0.8; }
  .search input{
    border:none; outline:none; background:transparent;
    color: var(--text);
    font-family:'Inter',sans-serif;
    font-size: 14px;
    width: 100%;
  }
  .search input::placeholder{ color: var(--text-dim); }

  .avatar{
    width: 38px; height: 38px;
    min-width: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #555, #222);
    border: 1px solid var(--line);
    cursor:pointer;
  }

  .icon-btn{
    width: 44px; height: 44px;
    min-width: 44px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: background 0.2s ease;
  }
  .icon-btn:hover{ background: var(--pill); }
  @media (max-width: 680px){ .icon-btn{ display:none; } }

  main{
    max-width: 1500px;
    margin: 0 auto;
    padding: 16px 10px 80px;
  }
  .grid{
    column-count: 2;
    column-gap: 10px;
  }
  @media (min-width: 560px){ .grid{ column-count: 3; column-gap: 12px; } }
  @media (min-width: 860px){ .grid{ column-count: 4; column-gap: 14px; } }
  @media (min-width: 1180px){ .grid{ column-count: 5; column-gap: 16px; } }

  figure.pin{
    margin: 0 0 12px;
    break-inside: avoid;
    border-radius: 16px;
    overflow: hidden;
    background: var(--card);
    position: relative;
    cursor: pointer;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.5s ease forwards;
  }
  @media (prefers-reduced-motion: reduce){
    figure.pin{ animation: none; opacity: 1; transform:none; }
  }
  @keyframes rise{ to{ opacity: 1; transform: translateY(0); } }

  figure.pin img{
    display:block;
    width: 100%;
    height: auto;
    transition: transform 0.3s ease, filter 0.3s ease;
  }
  figure.pin:hover img{ transform: scale(1.03); filter: brightness(0.8); }

  .pin-top,
  .pin-bottom{
    position:absolute;
    left: 8px; right: 8px;
    display:flex;
    align-items:center;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events:none;
  }
  .pin-top{ top: 8px; justify-content: space-between; }
  .pin-bottom{ bottom: 8px; justify-content: flex-end; transform: translateY(6px); }
  figure.pin:hover .pin-top,
  figure.pin:hover .pin-bottom{ opacity: 1; transform: translateY(0); pointer-events:auto; }

  .save-btn{
    background: var(--accent);
    color: #fff;
    border: none;
    font-family:'Inter',sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 22px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .save-btn:hover{ background: var(--accent-hover); transform: scale(1.04); }

  .dots-btn, .share-btn{
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.92);
    color: #222;
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .dots-btn{ font-weight: 900; letter-spacing: 1px; font-size: 14px; }
  .dots-btn:hover, .share-btn:hover{ background: #fff; }

  .pin-meta{
    padding: 8px 4px 2px;
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .pin-meta .mini-avatar{
    width: 24px; height: 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, #666, #222);
    flex:none;
  }
  .pin-meta span{
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 500;
  }

  figure.pin:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .lightbox{
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .lightbox.open{ opacity: 1; pointer-events: auto; }
  .lightbox-card{
    background: var(--card);
    border-radius: 20px;
    overflow: hidden;
    max-width: min(560px, 92vw);
    max-height: 88vh;
    display:flex;
    flex-direction:column;
    transform: scale(0.97);
    transition: transform 0.3s ease;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .lightbox.open .lightbox-card{ transform: scale(1); }
  .lightbox-card img{
    display:block;
    width: 100%;
    max-height: 70vh;
    object-fit: cover;
  }
  .lightbox-actions{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 14px 16px;
  }
  .lightbox-actions .save-btn{ font-size: 15px; padding: 11px 22px; }

  .lightbox .close,
  .lightbox .nav{
    position:absolute;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    color: #fff;
    width: 42px; height: 42px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size: 18px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .lightbox .close:hover,
  .lightbox .nav:hover{ background: rgba(230,0,35,0.25); border-color: var(--accent); }
  .lightbox .close{ top: calc(20px + env(safe-area-inset-top, 0px)); right: 20px; }
  .lightbox .nav.prev{ left: 20px; top: 50%; transform: translateY(-50%); }
  .lightbox .nav.next{ right: 20px; top: 50%; transform: translateY(-50%); }
  .lightbox .count{
    position:absolute;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.3px;
  }

  @media (max-width: 640px){
    .lightbox .nav{ width: 38px; height: 38px; }
    .lightbox .nav.prev{ left: 8px; }
    .lightbox .nav.next{ right: 8px; }
  }
</style>
</head>
<body>

<header>
  <button class="logo" aria-label="Inicio">P</button>
  <nav class="pills">
    <button class="active">Inicio</button>
    <button>Explorar</button>
    <button>Crear</button>
  </nav>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="text" placeholder="Buscar">
  </div>
  <button class="icon-btn" aria-label="Mensajes">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>
  <button class="icon-btn" aria-label="Notificaciones">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13.7 21a2 2 0 0 1-3.4 0"/><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg>
  </button>
  <button class="avatar" aria-label="Perfil"></button>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="lightbox" id="lightbox">
  <button class="nav prev" id="prevBtn" aria-label="Anterior">‹</button>
  <div class="lightbox-card">
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-actions">
      <div class="pin-meta"><div class="mini-avatar"></div><span id="lightboxLabel"></span></div>
      <button class="save-btn">Guardar</button>
    </div>
  </div>
  <button class="nav next" id="nextBtn" aria-label="Siguiente">›</button>
  <button class="close" id="closeBtn" aria-label="Cerrar">✕</button>
  <div class="count" id="count"></div>
</div>

<script>
  const fotos = Array.from({length: 12}, (_, i) => ({
    src: `foto${i + 1}.jpg`,
    alt: `Foto ${i + 1}`
  }));

  const grid = document.getElementById('grid');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxLabel = document.getElementById('lightboxLabel');
  const countEl = document.getElementById('count');
  let current = 0;

  fotos.forEach((foto, i) => {
    const fig = document.createElement('figure');
    fig.className = 'pin';
    fig.style.animationDelay = (i * 0.04) + 's';
    fig.tabIndex = 0;
    fig.setAttribute('role', 'button');
    fig.setAttribute('aria-label', 'Abrir ' + foto.alt);

    const img = document.createElement('img');
    img.src = foto.src;
    img.alt = foto.alt;
    img.loading = 'lazy';
    img.onerror = () => {
      fig.style.aspectRatio = (3 + (i % 3)) + ' / ' + (4 + (i % 2));
      fig.style.display = 'flex';
      fig.style.alignItems = 'center';
      fig.style.justifyContent = 'center';
      fig.style.background = 'linear-gradient(160deg, #232323, #121212)';
      img.remove();
      const ph = document.createElement('span');
      ph.textContent = foto.src;
      ph.style.color = 'var(--text-dim)';
      ph.style.fontSize = '12px';
      ph.style.letterSpacing = '0.3px';
      fig.appendChild(ph);
    };

    const top = document.createElement('div');
    top.className = 'pin-top';
    top.innerHTML = '<button class="dots-btn" aria-label="Más opciones">&bull;&bull;&bull;</button><button class="save-btn">Guardar</button>';
    top.querySelector('.save-btn').addEventListener('click', (e) => e.stopPropagation());
    top.querySelector('.dots-btn').addEventListener('click', (e) => e.stopPropagation());

    const bottom = document.createElement('div');
    bottom.className = 'pin-bottom';
    bottom.innerHTML = '<button class="share-btn" aria-label="Compartir"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg></button>';
    bottom.querySelector('.share-btn').addEventListener('click', (e) => e.stopPropagation());

    const meta = document.createElement('div');
    meta.className = 'pin-meta';
    meta.innerHTML = '<div class="mini-avatar"></div><span>' + foto.alt + '</span>';

    fig.appendChild(img);
    fig.appendChild(top);
    fig.appendChild(bottom);
    fig.appendChild(meta);
    fig.addEventListener('click', () => openLightbox(i));
    fig.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(i); }
    });

    grid.appendChild(fig);
  });

  function openLightbox(i){
    current = i;
    updateLightbox();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }
  function updateLightbox(){
    lightboxImg.src = fotos[current].src;
    lightboxImg.alt = fotos[current].alt;
    lightboxLabel.textContent = fotos[current].alt;
    countEl.textContent = (current + 1) + ' / ' + fotos.length;
  }
  function step(delta){
    current = (current + delta + fotos.length) % fotos.length;
    updateLightbox();
  }

  document.getElementById('closeBtn').addEventListener('click', closeLightbox);
  document.getElementById('prevBtn').addEventListener('click', () => step(-1));
  document.getElementById('nextBtn').addEventListener('click', () => step(1));
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
</script>
</body>
</html>
